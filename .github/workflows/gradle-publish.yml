name: Build and Upload JARs

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 8
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: 8

    # 缓存 Gradle 依赖
    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          gradle-${{ runner.os }}-

    # 构建所有子项目
    - name: Build with Gradle
      run: ./gradlew build --no-daemon

    # 查找所有 shadowJar（*.jar，不包括原始 jar）
    - name: Find all generated JARs
      run: |
        mkdir -p all-jars
        find . -type f -name "*.jar" -not -path "*/build/libs/*-sources.jar" -exec cp {} all-jars/ \;

    # 上传产物（artifact），保留 10 天
    - name: Upload JARs as Artifact
      uses: actions/upload-artifact@v4
      with:
        name: built-jars
        path: all-jars/*.jar
        retention-days: 10
